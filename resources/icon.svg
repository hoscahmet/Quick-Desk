<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Matte Obsidian / Charcoal Slate -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824" />
      <stop offset="50%" stop-color="#0e1117" />
      <stop offset="100%" stop-color="#080a0f" />
    </linearGradient>

    <!-- Squircle Border Highlight: Steel Blue / Cyan Subtle Rim -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.4" />
    </linearGradient>

    <!-- Lightning Bolt Gradient: Pure Electric Sky to Deep Sapphire (Zero Purple) -->
    <linearGradient id="bolt-grad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Desk / Workspace Platform Gradient -->
    <linearGradient id="desk-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.85" />
    </linearGradient>

    <!-- Soft Ambient Glow Filters -->
    <filter id="bolt-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="28" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Drop Shadow Style -->
  <rect
    x="32"
    y="32"
    width="448"
    height="448"
    rx="108"
    fill="url(#bg-grad)"
    stroke="url(#border-grad)"
    stroke-width="3"
  />

  <!-- Subtle Precision Tech Grid Lines (Linear / Raycast aesthetic) -->
  <g opacity="0.10" stroke="#38bdf8" stroke-width="1.5">
    <line x1="32" y1="160" x2="480" y2="160" />
    <line x1="32" y1="256" x2="480" y2="256" />
    <line x1="32" y1="352" x2="480" y2="352" />
    <line x1="160" y1="32" x2="160" y2="480" />
    <line x1="256" y1="32" x2="256" y2="480" />
    <line x1="352" y1="32" x2="352" y2="480" />
  </g>

  <!-- Ambient Light Center Radial Bloom (Pure Steel Blue & Sky) -->
  <circle cx="256" cy="240" r="115" fill="#3b82f6" opacity="0.22" filter="url(#soft-glow)" />
  <circle cx="270" cy="210" r="70" fill="#38bdf8" opacity="0.28" filter="url(#soft-glow)" />

  <!-- Layered Desk / Productivity Platform Motif -->
  <g transform="translate(0, 42)">
    <!-- Base shelf / tray -->
    <path
      d="M 140 310 L 372 310 C 382 310 390 318 390 328 L 390 330 C 390 340 382 348 372 348 L 140 348 C 130 348 122 340 122 330 L 122 328 C 122 318 130 310 140 310 Z"
      fill="url(#desk-grad)"
      opacity="0.8"
    />

    <!-- Upper floating precision indicator bar -->
    <path
      d="M 180 270 L 332 270 C 340 270 346 276 346 284 C 346 292 340 298 332 298 L 180 298 C 172 298 166 292 166 284 C 166 276 172 270 180 270 Z"
      fill="#38bdf8"
      opacity="0.45"
    />
  </g>

  <!-- Electric Speed Lightning Bolt Motif -->
  <path
    d="M 284 96 
       L 174 256 
       C 170 262 174 270 182 270 
       L 252 270 
       L 220 396 
       C 216 410 234 418 242 406 
       L 352 246 
       C 356 240 352 232 344 232 
       L 274 232 
       L 306 106 
       C 310 92 292 84 284 96 Z"
    fill="url(#bolt-grad)"
    filter="url(#bolt-glow)"
  />

  <!-- Glossy High-Precision Glass Reflection on Bolt -->
  <path
    d="M 284 96 
       L 210 205 
       L 265 205 
       L 235 320 
       L 330 236 
       L 274 236 
       L 306 106 
       C 309 94 294 85 284 96 Z"
    fill="#ffffff"
    opacity="0.25"
  />

  <!-- Subtle Top-Left Glass Rim Sheen -->
  <path
    d="M 32 140 C 32 80 80 32 140 32 L 372 32 C 400 32 426 43 445 61 C 380 75 220 120 100 240 C 60 280 42 330 32 380 Z"
    fill="#ffffff"
    opacity="0.05"
  />
</svg>
